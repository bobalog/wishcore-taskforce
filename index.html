<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>별빛 과제 구조대</title><style>
:root{--ink:#594a76;--lav:#c6a8ff;--pink:#ffd9ed;--line:#eadff5;--white:#fffefa;--soft:#f8f3ff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Trebuchet MS','Apple SD Gothic Neo',system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#fff0f9,transparent 38%),radial-gradient(circle at 90% 5%,#e9e3ff,transparent 40%),#f9f7ff}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:10px 14px;color:var(--ink);background:#eee5ff}button:hover{filter:brightness(.98)}button.primary{background:#b99cf6;color:white;font-weight:800}button.danger{background:#ffe0e5;color:#9a4863}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#fffafaed;border-right:1px solid var(--line);padding:25px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;text-align:center;margin-bottom:30px}.brand small{font-size:11px;display:block;font-weight:500;margin-top:8px}.nav{width:100%;text-align:left;background:transparent;margin:5px 0;padding:13px}.nav.active{background:#efe5ff;font-weight:800}.side-foot{position:absolute;bottom:20px;font-size:12px;padding:10px}main{max-width:1250px;width:100%;padding:28px 35px;margin:auto}.hero{padding:25px 28px;border-radius:25px;background:linear-gradient(115deg,#e6dbff,#ffe5f3 65%,#fff7dc);border:1px solid #fff;box-shadow:0 12px 40px #b49dd121}.hero h1{margin:0 0 8px;font-size:26px}.hero p{margin:0}.spark{font-size:25px;float:right}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:17px 0}.card{background:#ffffffd9;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 22px #8b6eae0a}.card h3{margin:0 0 10px;font-size:16px}.big{font-size:27px;font-weight:900}.muted{color:#978aa7;font-size:13px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.pill{display:inline-block;background:#f2eaff;padding:4px 9px;border-radius:50px;font-size:12px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item strong{font-size:14px}.item p{margin:5px 0;font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button{padding:6px 9px;font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}h2{font-size:20px}input,select,textarea{width:100%;border:1px solid #dfd4ed;border-radius:12px;background:white;padding:10px;color:#57486e}textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.formgrid .wide{grid-column:1/-1}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#4d3e6080;display:grid;place-items:center;padding:14px;z-index:10}.dialog{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fffafd;border-radius:24px;padding:22px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:92px;border:1px solid var(--line);background:white;border-radius:11px;padding:7px;font-size:12px;overflow:hidden}.day .dot{font-size:10px;margin-top:3px;background:#f3eaff;padding:3px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.links a{display:inline-block;margin:4px;padding:7px 10px;background:#eee5ff;border-radius:10px;color:#65517d;text-decoration:none}.photo{max-width:150px;max-height:120px;border-radius:12px;margin:5px;cursor:pointer}.week{font-size:12px;text-align:center;padding:6px}.subject{border-left:5px solid #c3a5ff}.notice{background:#fff9fd}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.topbar button{font-size:12px}.check{accent-color:#b49cf5;width:auto}.empty{padding:18px;text-align:center;color:#aa9eb8}.warning{color:#be5c79;font-weight:700}a{color:#8768be}@media(max-width:850px){.shell{display:block}aside{height:auto;position:static;padding:12px}.brand{margin-bottom:8px}.navs{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto;padding:9px}.side-foot{display:none}main{padding:14px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.hero h1{font-size:22px}.day{min-height:67px;padding:3px}.day .dot{font-size:9px}}@media(max-width:450px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}</style></head><body><div class="shell"><aside><div class="brand">ʚ ✦ 별빛 과제 구조대 ✦ ɞ<small>my little wishcore campus ♡</small></div><div class="navs" id="navs"></div><div class="side-foot">☁️ 작은 체크 하나가 큰 성취가 돼요</div></aside><main><div class="topbar"><span id="dateLabel"></span><span id="authStatus" class="muted">🔐 Google 로그인 필요</span><span id="authControls" class="row"></span><button onclick="refresh()">↻ 새로고침</button></div><div id="app"></div></main></div><div class="modal hidden" id="modal"><div class="dialog"><div class="row space"><h2 id="modalTitle">추가</h2><button onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><script>
const DAYS=['일','월','화','수','목','금','토'],PLAT=['Manaba','Google Classroom','Outlook','Teams','소테스트/퀴즈','기타'];let db={Subjects:[],Tasks:[],Notices:[],Photos:[],Schedule:[],Checks:[],Settings:[]},page='home',selectedSubject='',calendarOffset=0,weather=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dt=s=>s?new Date(s+'T00:00:00'):null;const daysLeft=s=>s?Math.round((dt(s)-dt(today()))/86400000):null;const subject=id=>db.Subjects.find(x=>x.id===id);const sname=id=>subject(id)?.name||'미분류';const fmt=s=>s?String(s).replace('T',' ').slice(0,16):'미정';const setting=k=>db.Settings.find(x=>x.key===k)?.value||'';const countActive=()=>db.Tasks.filter(x=>x.status!=='done');const btn=(t,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${t}</button>`;const itemEmpty=t=>`<div class="empty">✧ ${t} ✧</div>`;const TABLES={Subjects:['id','name','teacher','platform','url','color','note'],Tasks:['id','subjectId','title','type','due','priority','status','notes','supplies','platform','url','repeat','createdAt','updatedAt'],Notices:['id','subjectId','title','body','platform','url','createdAt','updatedAt'],Photos:['id','parentType','parentId','fileId','name','createdAt'],Schedule:['id','day','period','start','end','subjectId','room','supplies'],Checks:['date','platform','done'],Settings:['key','value']};
const SCOPES='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
let accessToken='', tokenClient=null, spreadsheetId=localStorage.getItem('wish_sheet_id')||'', driveFolderId='', signedEmail='';
const clientId=window.WISH_CONFIG?.GOOGLE_CLIENT_ID||'';
function requireLogin(){if(!accessToken)throw Error('먼저 Google 로그인을 해주세요.');if(!spreadsheetId)throw Error('새 저장소 만들기 또는 기존 시트 연결을 해주세요.');}
async function api(url,method='GET',data,headers={}){if(!accessToken)throw Error('Google 로그인 후 이용해 주세요.');const opts={method,headers:{Authorization:'Bearer '+accessToken,...headers}};if(data!==undefined){opts.body=typeof data==='string'||data instanceof Blob?data:JSON.stringify(data);if(data instanceof Blob)opts.headers['Content-Type']=data.type;else if(typeof data!=='string')opts.headers['Content-Type']='application/json';}let res=await fetch(url,opts);if(!res.ok){let msg=await res.text();if(res.status===401){accessToken='';updateAuth();throw Error('로그인 시간이 만료됐어요. 다시 로그인해 주세요.')}throw Error('Google API '+res.status+': '+msg.slice(0,250));}if(res.status===204)return {};const ct=res.headers.get('content-type')||'';return ct.includes('application/json')?res.json():res;}
const sheetsBase=()=>`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(spreadsheetId)}`;
const range=n=>encodeURIComponent("'"+n+"'!A:Z");
async function rawRows(name){const x=await api(`${sheetsBase()}/values/${range(name)}`);return x.values||[];}
async function putRow(name,rowIndex,values){const u=`${sheetsBase()}/values/${encodeURIComponent("'"+name+"'!A"+rowIndex)}?valueInputOption=RAW`;return api(u,'PUT',{values:[values]});}
async function appendRow(name,values){return api(`${sheetsBase()}/values/${range(name)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,'POST',{values:[values]});}
async function loadTable(name){const vals=await rawRows(name);return vals.slice(1).filter(r=>r.some(x=>x!==''&&x!=null)).map(r=>Object.fromEntries(TABLES[name].map((k,i)=>[k,String(r[i]??'')])));}
async function bootstrap(){requireLogin();const out={};for(const n of Object.keys(TABLES))out[n]=await loadTable(n);driveFolderId=out.Settings.find(x=>x.key==='driveFolderId')?.value||'';return out;}
async function saveRecord(name,obj){requireLogin();if(!['Subjects','Tasks','Notices','Schedule','Settings','Checks','Photos'].includes(name))throw Error('허용되지 않는 테이블');if(!obj||typeof obj!=='object')throw Error('잘못된 데이터');const keys=TABLES[name];if(!obj.id&&name!=='Settings'&&name!=='Checks')obj.id=crypto.randomUUID();if(['Tasks','Notices'].includes(name)){obj.updatedAt=new Date().toISOString();if(!obj.createdAt)obj.createdAt=obj.updatedAt;}const pk=name==='Settings'?'key':name==='Checks'?'date':'id';const vals=await rawRows(name);const i=vals.findIndex((r,j)=>j>0&&r[keys.indexOf(pk)]===obj[pk]&&(name!=='Checks'||r[1]===obj.platform));const old=i>=0?Object.fromEntries(keys.map((k,j)=>[k,vals[i][j]??''])):{};const merged={...old,...obj};const row=keys.map(k=>String(merged[k]??''));if(i>=0)await putRow(name,i+1,row);else await appendRow(name,row);return merged;}
async function deleteRecord(name,id){requireLogin();if(!['Subjects','Tasks','Notices','Schedule'].includes(name))throw Error('허용되지 않는 테이블');const vals=await rawRows(name);const idx=vals.findIndex((r,i)=>i>0&&r[0]===id);if(idx<0)return true;const meta=await api(`${sheetsBase()}?fields=sheets(properties(title,sheetId))`);const sheet=meta.sheets.find(x=>x.properties.title===name);await api(`${sheetsBase()}:batchUpdate`,'POST',{requests:[{deleteDimension:{range:{sheetId:sheet.properties.sheetId,dimension:'ROWS',startIndex:idx,endIndex:idx+1}}}]});if(['Tasks','Notices'].includes(name)){const photos=await loadTable('Photos');for(const p of photos.filter(p=>p.parentId===id))await deletePhoto(p.id);}return true;}
async function ensureFolder(){if(driveFolderId)return driveFolderId;const f=await api('https://www.googleapis.com/drive/v3/files?fields=id,name','POST',{name:'✧ 별빛 과제 구조대 공지사진',mimeType:'application/vnd.google-apps.folder'});driveFolderId=f.id;await saveRecord('Settings',{key:'driveFolderId',value:f.id});return f.id;}
async function uploadPhoto(data){requireLogin();if(!['Tasks','Notices'].includes(data.parentType))throw Error('잘못된 사진 유형');const bytes=Uint8Array.from(atob(data.base64),c=>c.charCodeAt(0));if(bytes.length>4*1024*1024)throw Error('사진 용량은 4MB 이하');const folder=await ensureFolder();const boundary='wish'+crypto.randomUUID().replaceAll('-','');const metadata={name:data.name||'notice.jpg',parents:[folder]};const prefix=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: image/jpeg\r\n\r\n`;const suffix=`\r\n--${boundary}--`;const blob=new Blob([prefix,bytes,suffix],{type:'multipart/related; boundary='+boundary});const file=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name','POST',blob,{'Content-Type':'multipart/related; boundary='+boundary});return saveRecord('Photos',{parentType:data.parentType,parentId:data.parentId,fileId:file.id,name:data.name||'notice.jpg',createdAt:new Date().toISOString()});}
async function getPhoto(id){requireLogin();const photo=(await loadTable('Photos')).find(p=>p.id===id);if(!photo)throw Error('사진이 없습니다');const response=await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(photo.fileId)+'?alt=media');const blob=await response.blob();return {mime:blob.type||'image/jpeg',base64:await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)}),name:photo.name};}
async function deletePhoto(id){requireLogin();const vals=await rawRows('Photos');const idx=vals.findIndex((r,i)=>i>0&&r[0]===id);if(idx<0)return true;const fileId=vals[idx][3];await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId),'DELETE');const meta=await api(`${sheetsBase()}?fields=sheets(properties(title,sheetId))`);const sh=meta.sheets.find(x=>x.properties.title==='Photos');await api(`${sheetsBase()}:batchUpdate`,'POST',{requests:[{deleteDimension:{range:{sheetId:sh.properties.sheetId,dimension:'ROWS',startIndex:idx,endIndex:idx+1}}}]});return true;}
async function createDatabase(){if(!accessToken)throw Error('먼저 로그인해 주세요');const spec={properties:{title:'✧ 별빛 과제 구조대 DB',timeZone:'Asia/Tokyo'},sheets:Object.entries(TABLES).map(([title,headers])=>({properties:{title,gridProperties:{frozenRowCount:1}},data:[{startRow:0,startColumn:0,rowData:[{values:headers.map(h=>({userEnteredValue:{stringValue:h},userEnteredFormat:{backgroundColor:{red:.95,green:.87,blue:1},textFormat:{bold:true}}}))}]}]}))};const created=await api('https://sheets.googleapis.com/v4/spreadsheets','POST',spec);spreadsheetId=created.spreadsheetId;localStorage.setItem('wish_sheet_id',spreadsheetId);await ensureFolder();await refresh();updateAuth();alert('저장소 생성 완료! 💗 시트 주소를 안전하게 보관해 주세요.');}
async function connectDatabase(){const s=prompt('Google 스프레드시트 URL 또는 ID를 입력해 주세요.',spreadsheetId||'');if(!s)return;const match=s.match(/\/spreadsheets\/d\/([\w-]+)/);spreadsheetId=match?match[1]:s.trim();localStorage.setItem('wish_sheet_id',spreadsheetId);await refresh();updateAuth();}
function updateAuth(){const el=document.getElementById('authStatus');if(el)el.textContent=accessToken?('🔒 로그인됨'+(signedEmail?' · '+signedEmail:'')):'🔐 Google 로그인 필요';const a=document.getElementById('authControls');if(a)a.innerHTML=accessToken?`<button onclick="createDatabase()">＋ 새 저장소</button><button onclick="connectDatabase()">🔗 기존 시트 연결</button><button onclick="logout()">로그아웃</button>`:`<button class="primary" onclick="login()">Google 로그인</button>`;}
function login(){if(!clientId||clientId.includes('YOUR_'))return alert('config.js에 Google OAuth 클라이언트 ID를 입력해 주세요.');if(!window.google?.accounts?.oauth2)return alert('Google 로그인 라이브러리를 불러오지 못했어요.');if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:SCOPES,callback:async result=>{if(result.error){alert('로그인 실패: '+result.error);return;}accessToken=result.access_token;try{const p=await api('https://www.googleapis.com/oauth2/v3/userinfo');signedEmail=p.email||'';}catch{}updateAuth();if(spreadsheetId)await refresh();else document.getElementById('app').innerHTML='<div class="card"><h2>🪽 첫 시작!</h2><p>상단의 ＋ 새 저장소 버튼을 눌러 Google Sheets와 Drive 폴더를 만들어 주세요.</p></div>';}});tokenClient.requestAccessToken({prompt:'consent'});}
function logout(){if(accessToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(accessToken,()=>{});accessToken='';signedEmail='';db=Object.fromEntries(Object.keys(TABLES).map(n=>[n,[]]));updateAuth();document.getElementById('app').innerHTML='<div class="card">로그아웃했어요. 다시 로그인하면 데이터를 불러올 수 있어요.</div>';}
function server(fn,...args){const funcs={bootstrap,saveRecord,deleteRecord,uploadPhoto,getPhoto,deletePhoto};return funcs[fn](...args);}
async function refresh(){try{db=await server('bootstrap');render()}catch(e){document.getElementById('app').innerHTML=`<div class="card"><h2>☁️ 연결 안내</h2><p>${esc(e.message)}</p><p>상단에서 Google 로그인 후 새 저장소를 만들거나 기존 스프레드시트 ID를 연결해 주세요.</p></div>`}}
async function save(table,obj){try{await server('saveRecord',table,obj);await refresh();closeModal()}catch(e){alert('저장 실패: '+e.message)}}async function del(table,id){if(!confirm('정말 삭제할까요?'))return;try{await server('deleteRecord',table,id);refresh()}catch(e){alert(e.message)}}function nav(p){page=p;selectedSubject='';render()}function render(){const navs=[['home','🏠 홈'],['tasks','📋 과제/시험'],['subjects','📚 과목관리'],['notices','📣 공지'],['schedule','🗓 시간표'],['calendar','🌙 달력'],['settings','⚙️ 설정']];$('navs').innerHTML=navs.map(([id,n])=>`<button class="nav ${page===id?'active':''}" onclick="nav('${id}')">${n}</button>`).join('');$('dateLabel').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('app').innerHTML=({home:home,tasks:tasks,subjects:subjects,notices:notices,schedule:schedule,calendar:calendar,settings:settings})[page]();if(page==='home')loadWeather()}
function taskCard(t){const d=daysLeft(t.due);const status=t.status==='done';return `<div class="item"><div class="row space"><strong>${status?'✅':'🌟'} ${esc(t.title)}</strong><span class="pill">${esc(t.type||'과제')}</span></div><p>${esc(sname(t.subjectId))} · ${esc(t.platform||'')} · ${esc(fmt(t.due))} ${!status&&d!==null?(d<0?'<span class="warning">기한 지남</span>':d===0?'<span class="warning">오늘 마감!</span>':`D-${d}`):''}</p>${t.supplies?`<p>🎒 ${esc(t.supplies)}</p>`:''}<div class="actions">${btn(status?'↩ 되돌리기':'✓ 완료',`toggleTask('${t.id}')`)}${btn('✎ 수정',`openTask('${t.id}')`)}${btn('📷 사진',`photos('Tasks','${t.id}')`)}${t.url?`<a href="${esc(safeUrl(t.url))}" target="_blank" rel="noopener">원문 ↗</a>`:''}${btn('삭제',`del('Tasks','${t.id}')`,'danger')}</div></div>`}
function safeUrl(u){try{const x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}function taskSort(a,b){return (a.due||'9999').localeCompare(b.due||'9999')}function home(){const active=countActive().sort(taskSort),due=active.filter(t=>daysLeft(t.due)===0),soon=active.filter(t=>{const d=daysLeft(t.due);return d!==null&&d>=0&&d<=3}),day=new Date().getDay(),classes=db.Schedule.filter(x=>Number(x.day)===day).sort((a,b)=>Number(a.period)-Number(b.period));return `<div class="hero"><span class="spark">☁️ ʚɞ ✧ ⭐</span><h1>오늘도 반짝이는 하루, 파이팅! ♡</h1><p>놓치는 과제 없이, 하나씩 별을 모아보자 ✨</p></div><div class="grid"><div class="card"><h3>🌤 나가사키외국어대학 날씨</h3><div id="weather">날씨 불러오는 중…</div></div><div class="card"><h3>💌 오늘 마감</h3><div class="big">${due.length}개</div><span class="muted">오늘 끝내면 마음이 가벼워져요</span></div><div class="card"><h3>⭐ 3일 이내 마감</h3><div class="big">${soon.length}개</div><span class="muted">완료하지 않은 과제 기준</span></div></div><div class="two"><div><div class="card"><div class="row space"><h3>🪽 오늘의 시간표</h3>${btn('+ 시간표',"openSchedule()")}</div>${classes.length?classes.map(c=>`<div class="item"><strong>${esc(c.period)}교시 · ${esc(sname(c.subjectId))}</strong><p>${esc(c.start)} ~ ${esc(c.end)} · ${esc(c.room)}</p><p>🎒 준비물: ${esc(c.supplies||'등록된 준비물 없음')}</p></div>`).join(''):itemEmpty('오늘 등록된 수업이 없어요')}</div><div class="card" style="margin-top:16px"><div class="row space"><h3>🎀 마감 순서대로 할 일</h3>${btn('+ 과제',"openTask()",'primary')}</div>${active.length?active.slice(0,8).map(taskCard).join(''):itemEmpty('등록된 미완료 과제가 없어요')}</div></div><div><div class="card"><h3>🔖 매일 사이트 확인하기</h3><p class="muted">체크는 날짜별로 저장돼요</p>${PLAT.slice(0,5).map(p=>{const ck=db.Checks.find(x=>x.date===today()&&x.platform===p);return `<div class="item"><label style="margin:0"><input class="check" type="checkbox" ${ck?.done==='true'?'checked':''} onchange="checkPlatform('${p}',this.checked)"> ${esc(p)}</label></div>`}).join('')}</div><div class="card" style="margin-top:16px"><h3>🧸 자주 쓰는 사이트</h3><div class="links">${db.Subjects.filter(x=>x.url).slice(0,6).map(x=>`<a target="_blank" rel="noopener" href="${esc(safeUrl(x.url))}">${esc(x.name)} ↗</a>`).join('')||'과목 관리에서 링크를 등록해 주세요'}</div></div><div class="card" style="margin-top:16px"><h3>📣 최근 등록한 공지</h3>${db.Notices.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4).map(n=>`<div class="item"><strong>${esc(n.title)}</strong><p>${esc(sname(n.subjectId))}</p>${btn('자세히',`viewNotice('${n.id}')`)}</div>`).join('')||itemEmpty('아직 공지가 없어요')}</div></div></div>`}
async function loadWeather(){if(!$('weather'))return;try{if(!weather){const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=32.815&longitude=129.877&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=1');if(!r.ok)throw Error('weather');weather=await r.json()}const c=weather.current,d=weather.daily;const label=c.weather_code<=1?'맑음 ☀️':c.weather_code<=3?'구름 ⛅':c.weather_code>=51&&c.weather_code<=67?'비 ☔':c.weather_code>=95?'천둥번개 ⛈️':'흐림 ☁️';$('weather').innerHTML=`<div class="big">${Math.round(c.temperature_2m)}°C</div><p>${label} · 습도 ${c.relative_humidity_2m}%</p><p class="muted">최고 ${Math.round(d.temperature_2m_max[0])}° / 최저 ${Math.round(d.temperature_2m_min[0])}°<br>강수확률 최대 ${d.precipitation_probability_max[0]}%</p><p class="muted">Open-Meteo · 캠퍼스 근처 좌표 기준</p>`}catch(e){if($('weather'))$('weather').innerHTML='날씨 연결이 안 됐어요. 인터넷 연결을 확인해 주세요.'}}
function tasks(){const q=selectedSubject;const list=db.Tasks.filter(t=>!q||t.subjectId===q).sort(taskSort);return `<div class="section-head"><h2>📋 과제 · 시험 · 소테스트</h2>${btn('+ 새 과제',"openTask()",'primary')}</div><div class="card"><label>과목 필터</label><select onchange="selectedSubject=this.value;render()"><option value="">전체 과목</option>${db.Subjects.map(s=>`<option value="${s.id}" ${q===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${list.map(taskCard).join('')||itemEmpty('첫 과제를 등록해봐요')}</div>`}
function subjects(){return `<div class="section-head"><h2>📚 과목 관리</h2>${btn('+ 과목 추가',"openSubject()",'primary')}</div><div class="grid">${db.Subjects.map(s=>`<div class="card subject"><h3>✧ ${esc(s.name)}</h3><p class="muted">${esc(s.teacher)} · ${esc(s.platform)}</p><p>${esc(s.note)}</p><p>미완료 ${db.Tasks.filter(t=>t.subjectId===s.id&&t.status!=='done').length}개 · 공지 ${db.Notices.filter(n=>n.subjectId===s.id).length}개</p><div class="actions">${btn('공지 보기',`selectedSubject='${s.id}';page='notices';render()`)}${btn('✎',`openSubject('${s.id}')`)}${s.url?`<a target="_blank" rel="noopener" href="${esc(safeUrl(s.url))}">사이트 ↗</a>`:''}${btn('삭제',`del('Subjects','${s.id}')`,'danger')}</div></div>`).join('')||itemEmpty('과목을 먼저 추가해주세요')}</div><p class="muted">※ 공지는 직접 추가하는 방식이에요. Manaba·Teams에서 자동 수집하지는 않아요.</p>`}
function notices(){const list=db.Notices.filter(n=>!selectedSubject||n.subjectId===selectedSubject);return `<div class="section-head"><h2>📣 과목별 공지 모아보기</h2>${btn('+ 공지 등록',"openNotice()",'primary')}</div><div class="card"><select onchange="selectedSubject=this.value;render()"><option value="">전체 과목</option>${db.Subjects.map(s=>`<option value="${s.id}" ${selectedSubject===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${list.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(n=>`<div class="item notice"><strong>💌 ${esc(n.title)}</strong><p>${esc(sname(n.subjectId))} · ${esc(n.platform)} · ${esc(fmt(n.createdAt))}</p><p>${esc(n.body).slice(0,150)}</p><div class="actions">${btn('상세/사진',`viewNotice('${n.id}')`)}${btn('수정',`openNotice('${n.id}')`)}${btn('삭제',`del('Notices','${n.id}')`,'danger')}</div></div>`).join('')||itemEmpty('공지를 추가하면 여기에 쌓여요')}</div>`}
function schedule(){return `<div class="section-head"><h2>🗓 나의 주간 시간표</h2>${btn('+ 수업 추가',"openSchedule()",'primary')}</div><div class="grid">${[1,2,3,4,5,6,0].map(day=>`<div class="card"><h3>${DAYS[day]}요일</h3>${db.Schedule.filter(c=>Number(c.day)===day).sort((a,b)=>Number(a.period)-Number(b.period)).map(c=>`<div class="item"><strong>${esc(c.period)}교시 ${esc(sname(c.subjectId))}</strong><p>${esc(c.start)} ~ ${esc(c.end)}<br>${esc(c.room)}<br>🎒 ${esc(c.supplies)}</p><div class="actions">${btn('수정',`openSchedule('${c.id}')`)}${btn('삭제',`del('Schedule','${c.id}')`,'danger')}</div></div>`).join('')||'<p class="muted">비어 있음</p>'}</div>`).join('')}</div>`}
function calendar(){const now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+calendarOffset,1),year=first.getFullYear(),month=first.getMonth(),last=new Date(year,month+1,0).getDate(),offset=first.getDay();let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=last;d++){const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ts=db.Tasks.filter(t=>t.due.startsWith(key));cells+=`<div class="day" style="${key===today()?'border:2px solid #b99cf6':''}"><strong>${d}</strong>${ts.slice(0,4).map(t=>`<div class="dot" title="${esc(t.title)}">${t.status==='done'?'✓':'✦'} ${esc(t.title)}</div>`).join('')}</div>`}return `<div class="section-head"><h2>🌙 ${year}년 ${month+1}월</h2><div>${btn('‹',`calendarOffset--;render()`)} ${btn('오늘',`calendarOffset=0;render()`)} ${btn('›',`calendarOffset++;render()`)}</div></div><div class="card"><div class="calendar">${DAYS.map(x=>`<div class="week">${x}</div>`).join('')}${cells}</div></div>`}
function settings(){return `<div class="section-head"><h2>⚙️ 나의 설정</h2></div><div class="card"><h3>🔗 과제 사이트 주소</h3><p class="muted">과목별 URL은 과목관리에서 설정해 주세요. 아래는 기본 사이트 바로가기예요.</p><div class="links"><a target="_blank" href="https://classroom.google.com/">Classroom ↗</a><a target="_blank" href="https://outlook.office.com/">Outlook ↗</a><a target="_blank" href="https://teams.microsoft.com/">Teams ↗</a></div><p>📦 과제·공지·시간표 데이터는 Google Sheets, 첨부 사진은 Google Drive에 저장됩니다.</p><p>☁️ 이 페이지의 날씨는 Open-Meteo에서 불러오며 캠퍼스 근처 예보입니다.</p><p class="warning">⚠️ GitHub Pages의 HTML은 공개될 수 있지만, 과제와 사진은 Google OAuth로 로그인한 계정의 비공개 Sheets·Drive에 저장됩니다. 공유 설정을 공개로 바꾸지 마세요.</p></div>`}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}const field=(label,name,value='',type='text',wide=false)=>`<div class="${wide?'wide':''}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`;const options=(values,selected)=>values.map(([v,t])=>`<option value="${esc(v)}" ${String(selected)===String(v)?'selected':''}>${esc(t)}</option>`).join('');const subSelect=(value='')=>`<label>과목</label><select name="subjectId"><option value="">미분류</option>${options(db.Subjects.map(s=>[s.id,s.name]),value)}</select>`;const platSelect=(value='')=>`<label>공지 사이트</label><select name="platform"><option value="">선택</option>${options(PLAT.map(p=>[p,p]),value)}</select>`;const formValues=f=>Object.fromEntries(new FormData(f).entries());
function openTask(id){const t=db.Tasks.find(x=>x.id===id)||{};openModal(id?'과제 수정':'⭐ 새 과제 등록',`<form id="editor" onsubmit="event.preventDefault();save('Tasks',{...formValues(this),id:'${esc(id||'')}',createdAt:'${esc(t.createdAt||'')}'})"><div class="formgrid">${field('과제명 / 시험명','title',t.title||'','text',true)}<div>${subSelect(t.subjectId)}</div><div><label>종류</label><select name="type">${options(['과제','시험','소테스트','퀴즈','준비물','기타'].map(x=>[x,x]),t.type||'과제')}</select></div>${field('마감일과 시간','due',t.due||'','datetime-local')}<div><label>우선순위</label><select name="priority">${options([['high','🔥 높음'],['normal','보통'],['low','낮음']],t.priority||'normal')}</select></div><div>${platSelect(t.platform)}</div><div><label>진행 상태</label><select name="status">${options([['todo','할 일'],['doing','진행 중'],['done','완료']],t.status||'todo')}</select></div>${field('공지 원문 링크','url',t.url||'','url',true)}${field('준비물','supplies',t.supplies||'','text',true)}<div class="wide"><label>과제 설명 / 공지 메모</label><textarea name="notes">${esc(t.notes||'')}</textarea></div></div><button class="primary" type="submit">💾 저장하기</button></form>${id?`<hr>${btn('📸 공지 사진 관리',`photos('Tasks','${id}')`)}`:'<p class="muted">먼저 과제를 저장한 후 사진을 첨부할 수 있어요.</p>'}`)}
function openSubject(id){const s=subject(id)||{};openModal(id?'과목 수정':'📚 과목 추가',`<form onsubmit="event.preventDefault();save('Subjects',{...formValues(this),id:'${esc(id||'')}'})">${field('과목명','name',s.name||'')}${field('교수 / 담당자','teacher',s.teacher||'')}${platSelect(s.platform)}${field('과목 사이트 URL','url',s.url||'','url')}${field('메모','note',s.note||'')}<button class="primary">저장하기</button></form>`)}
function openNotice(id){const n=db.Notices.find(x=>x.id===id)||{};openModal(id?'공지 수정':'💌 공지 등록',`<form onsubmit="event.preventDefault();save('Notices',{...formValues(this),id:'${esc(id||'')}',createdAt:'${esc(n.createdAt||'')}'})">${field('공지 제목','title',n.title||'')}${subSelect(n.subjectId||selectedSubject)}${platSelect(n.platform)}${field('원문 링크','url',n.url||'','url')}<label>공지 내용</label><textarea name="body">${esc(n.body||'')}</textarea><button class="primary">저장하기</button></form>${id?`<hr>${btn('📸 공지 사진 관리',`photos('Notices','${id}')`)}`:'<p class="muted">저장 후 사진을 추가할 수 있어요.</p>'}`)}
function viewNotice(id){const n=db.Notices.find(x=>x.id===id);if(!n)return;openModal(n.title,`<p>${esc(sname(n.subjectId))} · ${esc(n.platform)}</p><p style="white-space:pre-wrap">${esc(n.body)}</p>${n.url?`<p><a target="_blank" rel="noopener" href="${esc(safeUrl(n.url))}">원문 열기 ↗</a></p>`:''}<div id="photoList"></div>${btn('📸 사진 추가/관리',`photos('Notices','${id}')`)}`);showPhotos('Notices',id)}
function openSchedule(id){const c=db.Schedule.find(x=>x.id===id)||{};openModal('🪽 수업 시간표',`<form onsubmit="event.preventDefault();save('Schedule',{...formValues(this),id:'${esc(id||'')}'})">${subSelect(c.subjectId)}<label>요일</label><select name="day">${options([1,2,3,4,5,6,0].map(x=>[x,DAYS[x]+'요일']),c.day??1)}</select>${field('교시','period',c.period||'1','number')}${field('시작 시간','start',c.start||'','time')}${field('종료 시간','end',c.end||'','time')}${field('강의실','room',c.room||'')}${field('준비물','supplies',c.supplies||'')}<button class="primary">저장하기</button></form>`)}
async function toggleTask(id){const t=db.Tasks.find(x=>x.id===id);await save('Tasks',{id,status:t.status==='done'?'todo':'done'})}async function checkPlatform(platform,done){try{await server('saveRecord','Checks',{date:today(),platform,done:String(done)});db.Checks=await server('bootstrap').then(x=>x.Checks)}catch(e){alert(e.message)}}
function photos(type,id){openModal('📷 공지 사진 보관함',`<p class="muted">사진은 Google Drive에 비공개 저장돼요. 업로드 후 어느 기기에서나 이 사이트에서 볼 수 있어요.</p><input type="file" accept="image/*" multiple id="photoInput"><p><button class="primary" onclick="uploadPhotos('${type}','${id}')">사진 업로드</button></p><div id="photoList">불러오는 중…</div>`);showPhotos(type,id)}async function showPhotos(type,id){const box=$('photoList');if(!box)return;const pics=db.Photos.filter(x=>x.parentType===type&&x.parentId===id);box.innerHTML=pics.length?pics.map(p=>`<div class="item"><span>🖼 ${esc(p.name)}</span><div class="actions">${btn('사진 보기',`previewPhoto('${p.id}')`)}${btn('삭제',`removePhoto('${p.id}','${type}','${id}')`,'danger')}</div></div>`).join(''):itemEmpty('아직 첨부 사진이 없어요')}async function previewPhoto(id){try{const p=await server('getPhoto',id);const w=window.open('','_blank');if(!w){alert('팝업 허용 후 다시 시도해 주세요');return}w.document.write(`<img style="max-width:100%" src="data:${p.mime};base64,${p.base64}">`);w.document.close()}catch(e){alert(e.message)}}async function removePhoto(id,type,parent){if(!confirm('사진을 삭제할까요?'))return;try{await server('deletePhoto',id);db=await server('bootstrap');showPhotos(type,parent)}catch(e){alert(e.message)}}async function uploadPhotos(type,id){const files=[...$('photoInput').files];if(!files.length)return alert('사진을 선택해 주세요');for(const f of files){try{const b64=await shrink(f);await server('uploadPhoto',{parentType:type,parentId:id,name:f.name,mime:'image/jpeg',base64:b64})}catch(e){alert(f.name+': '+e.message)}}db=await server('bootstrap');showPhotos(type,id);$('photoInput').value=''}function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.8).split(',')[1])};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지 읽기 실패'))};img.src=url})}updateAuth();document.getElementById("app").innerHTML="<div class=card><h2>🪽 Google 로그인부터 시작해요!</h2><p>오른쪽 위 로그인 버튼을 눌러주세요.</p></div>";</script></body></html>
